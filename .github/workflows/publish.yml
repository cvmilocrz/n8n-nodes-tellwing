name: Publish to npm

# Publishes n8n-nodes-tellwing to npm with provenance, as required for verified n8n community nodes.
# Authentication uses npm trusted publishing (OIDC): no npm token is stored in this repository.
# The trusted publisher only allows staged publishing: the version waits on npmjs.com until a
# maintainer approves it with 2FA (`npm stage approve` or the website).
# Trigger: publishing a GitHub release whose tag matches the version in package.json (e.g. v0.1.1).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      - run: npm stage publish --provenance --access public
